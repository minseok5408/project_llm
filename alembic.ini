[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s
path_separator = os

# env.py에서 MIGRATION_DATABASE_URL 또는 DATABASE_URL의 접속 정보를 읽습니다.
# Git으로 관리하는 이 파일에는 접속 URL을 기록하지 않습니다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
