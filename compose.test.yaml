# scripts/test_db.py로 이 파일을 독립 실행하며, 개발 설정을 덮어쓰는 용도로 사용하지 않습니다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qwen_test
      POSTGRES_USER: qwen
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use scripts/test_db.py}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s
